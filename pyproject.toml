[project]
name = "freedave-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "deprecated>=1.3.1",
    "flash-attn>=2.8.3",
    "termcolor>=3.3.0",
    "torch>=2.10.0",
    "transformers==4.52.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
